spring:
  application:
    name: spring-ai-library-study
  config:
    import:
      - optional:file:../spring-ai-library-study/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
  # 코드 변경사항 있을 시 자동으로 적용해서 서버 재실행하는 옵션
  devtools:
    restart:
      enabled: false
  ai:
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_URL}
      chat:
        model: qwen3.5:9b
        think: false
        format: json
        num-ctx: 8192
        num-predict: 2048
      embedding:
        model: bge-m3
    openai:
      embedding:
        base-url: ${EMBEDDING_URL}
        api-key: ${EMBEDDING_API_KEY}
        model: bge-m3
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: false
  cache:
    type: redis
    redis:
      time-to-live: 24h
      cache-null-values: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 5
        acknowledge-mode: auto

rabbitmq:
  queue:
    review-summary: nhnacademy-library-review

book:
  bulk-insert:
    runner:
      # db 초기 적재에 대한 옵션
      enabled: false
      method: CopyManager
      csv-path: src/main/resources/data/BOOK_DB_202112.csv
      batch-size: 1000
      row-limit: 0
      # true 시 데이터베이스 리셋 후 등록
      reset-before-run: false
  embedding:
    generation:
      # 초기 데이터 임베딩을 수행할지에 대한 옵션
      enabled: false
      batch-size: 128
      row-limit: 0

telegram:
  bot:
    enabled: false # 일단 기본 비활성화
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

logging:
  level:
    com.nhnacademy.springailibrarystudy: debug
