<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG 도서 추천 결과</title>
</head>
<body>
<main>
    <h1>도서 추천 결과</h1>

    <section>
        <h2>질문</h2>
        <p th:text="${question}">질문</p>
    </section>

    <section>
        <h2>요약</h2>
        <p th:text="${answer}">추천 결과 요약</p>
        <p th:if="${fallback}">일부 기능이 제한되어 검색 결과 기반으로 표시합니다.</p>
    </section>

    <section>
        <h2>추천 도서</h2>
        <p th:if="${#lists.isEmpty(books)}">추천할 도서를 찾지 못했습니다.</p>

        <article th:each="book : ${books}">
            <h3 th:text="${book.title()}">도서 제목</h3>
            <img th:if="${book.imageUrl() != null}" th:src="${book.imageUrl()}" alt="" width="120">
            <p>
                <span th:if="${book.authorName() != null}" th:text="${book.authorName()}">저자</span>
                <span th:if="${book.publisherName() != null}">
                    · <span th:text="${book.publisherName()}">출판사</span>
                </span>
            </p>
            <p th:if="${book.isbn13() != null}">
                ISBN: <span th:text="${book.isbn13()}">ISBN</span>
            </p>
            <p th:if="${book.description() != null}" th:text="${book.description()}">도서 설명</p>
            <!-- ★ 리뷰 정보 (평점/리뷰수 있을 때만 표시) -->
            <div class="review-info"
                 th:if="${book.averageRating() != null and book.reviewCount() != null and book.reviewCount() > 0}">
                <span class="review-rating">
                    ★ <span th:text="${#numbers.formatDecimal(book.averageRating(), 1, 1)}">0.0</span>/5.0
                    (<span th:text="${book.reviewCount()}">0</span>개 리뷰)
                </span>
                <p class="review-summary"
                   th:if="${book.reviewSummary() != null and !#strings.isEmpty(book.reviewSummary())}"
                   th:utext="${
                        #strings.replace(
                            #strings.replace(
                                #strings.replace(
                                    #strings.replace(book.reviewSummary(), '**장점**', '<b>장점</b>'),
                                    '**단점**', '<br><br><b>단점</b>'),
                                '**총평**', '<br><br><b>총평</b>'),
                            '**', '')
                   }">
                    리뷰 요약
                </p>
            </div>
            <div class="review-info"
                 th:unless="${book.averageRating() != null and book.reviewCount() != null and book.reviewCount() > 0}">
                <span class="no-review">리뷰가 없는 도서입니다.</span>
            </div>
            <p>
                추천 이유:
                <span th:text="${book.recommendationReason()}">추천 이유</span>
            </p>
            <p>
                <span th:text="${book.rrfScore()}">rrf-score</span>
            </p>
        </article>
    </section>
</main>
</body>
</html>
